/* Scene revision: chat occupies the former wordmark area. */

/* v3 — robust chat and studio */
#stage .msg{max-width:100%;word-break:normal;overflow-wrap:anywhere;white-space:normal}

#studio #notice{color:#f0757d;min-height:16px;margin-top:12px;font-size:12px}

/* Reference layout: top-right camera / bottom-right chat */

/* Motion pass — short entrances, restrained ambient movement */
#alert.on{animation:alertWipe .48s cubic-bezier(.16,1,.3,1) forwards}
#alert.on .kind{animation:alertText .45s .12s both}
#alert.on .who{animation:alertText .45s .22s both}
.scene.active .status{animation:titleReveal .8s .12s cubic-bezier(.2,.8,.2,1) both}
.scene.active .caption{animation:quietReveal .8s .36s both}
.camera-frame:before{animation:cameraAccent 16s ease-in-out infinite;max-width:100%}
#stage .msg{animation:messageArrive .38s cubic-bezier(.2,.8,.2,1) both}
#stage:has(.scene.active) .msg{animation:messageDrop .38s cubic-bezier(.2,.8,.2,1) both}
#stage .msg.out{animation:messageLeave .45s forwards}
.scene .dot{animation:statusBreathe 3.5s ease-in-out infinite}
@keyframes alertWipe{0%{opacity:0;transform:translateX(18px);clip-path:inset(0 0 0 100%)}35%{opacity:1}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}

@keyframes cameraAccent{0%,70%,100%{left:-1px;width:65px;opacity:.8}82%{left:calc(100% - 66px);width:65px;opacity:1}90%{left:calc(100% - 66px);width:65px;opacity:.5}}

@keyframes messageDrop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes messageLeave{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-5px)}}
@keyframes statusBreathe{0%,100%{opacity:.9}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#stage *{animation:none!important;transition:none!important}#alert.on{opacity:1;transform:none;clip-path:none}}

function message(d){window.loraiiEmotes?.handle(d);if(cfg.hideCommands&&String(d.text||'').trim().startsWith('!'))return;if(cfg.hideBots&&['streamelements','nightbot','streamlabs','moobot'].includes(String(d.displayName||d.nick||'').toLowerCase()))return;if(sceneMode==='alerts')return;const row=document.createElement('div');row.className='msg';row.dataset.msgId=d.msgId||'';row.dataset.userId=d.userId||'';const n=document.createElement('span');n.className='name';n.textContent=d.displayName||d.nick||'viewer';const badge=(d.badges||[]).find(b=>['moderator','subscriber','broadcaster'].includes(b.type));if(badge){const b=document.createElement('span');b.className='badge';b.textContent=badge.type==='moderator'?'◆':'✦';row.append(b)}row.append(n);const t=String(d.text||'');let cursor=0;for(const e of [...(d.emotes||[])].sort((a,b)=>a.start-b.start)){let u=safeImage(e.urls?.['2']||e.urls?.['1']);if(!u||e.start<cursor||e.end>=t.length)continue;if(window.loraiiEmotes)window.loraiiEmotes.append(row,t.slice(cursor,e.start));else row.append(document.createTextNode(t.slice(cursor,e.start)));const img=document.createElement('img');img.src=u;img.alt=t.slice(e.start,e.end+1);row.append(img);cursor=e.end+1}if(window.loraiiEmotes)window.loraiiEmotes.append(row,t.slice(cursor));else row.append(document.createTextNode(t.slice(cursor)));chat.append(row);while(chat.children.length>(sceneMode==='justchat'?8:(cfg.chatLimit||6)))chat.firstChild.remove();if(['starting','break','ending','browser','browser-no-cam','justchat'].includes(sceneMode)){while(chat.children.length>1&&chat.scrollHeight>parseFloat(getComputedStyle(chat).maxHeight))chat.firstChild.remove();}setTimeout(()=>{if(!cfg.persistentChat){row.classList.add('out');setTimeout(()=>row.remove(),500)}},(cfg.chatLifetime||30)*1000);}
function tone(){if(!soundEnabled||muted||!cfg.sound)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)();[440,660].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);let t=ac.currentTime+i*.1;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.23)});setTimeout(()=>ac.close(),700)}catch{}}
function next(){if(busy||!queue.length)return;busy=true;let e=queue.shift();box.querySelector('.kind').textContent=e.title;box.querySelector('.who').textContent=e.text;box.className='';void box.offsetWidth;box.className='on';box.querySelector('.progress')?.remove();const line=document.createElement('div');line.className='progress';line.style.animationDuration=(cfg.alertDuration||6)+'s';box.append(line);tone();timer=setTimeout(skip,(cfg.alertDuration||6)*1000);}
function skip(){clearTimeout(timer);box.className='off';setTimeout(()=>{busy=false;next()},450)}
function alertEvent(title,text){if(sceneMode==='chat')return;queue.push({title,text});if(queue.length>50)queue.shift();next()}
function receive(detail){const {listener:l,event:e={}}=detail||{};if(l==='message')return message(e.data||e);if(l==='delete-message'||l==='delete-messages'){for(const r of [...chat.children])if(l==='delete-message'?r.dataset.msgId===e.msgId:!e.userId||r.dataset.userId===e.userId)r.remove();return}if(l==='event:skip')return skip();if(l==='alertService:toggleSound'){muted=!!e.muted;return}if(e.isCommunityGift||e.playedAsCommunityGift)return;const name=e.name||'a lovely human';if(l==='follower-latest')alertEvent('NEW FOLLOW',`welcome, ${name}`);if(l==='subscriber-latest')alertEvent(e.bulkGifted||e.gifted?'GIFTED SUB':'NEW SUB',e.bulkGifted?`${e.sender||name} · ${e.amount} gifted subs`:e.gifted?`${e.sender||name} gifted a sub to ${name}`:`${name} · ${e.amount||1} month${Number(e.amount||1)>1?'s':''}`);if(l==='raid-latest')alertEvent('RAID INCOMING',`${name} + ${e.amount||1} friends`);if(l==='cheer-latest')alertEvent('THANK YOU',`${name} · ${e.amount} bits`);if(l==='tip-latest')alertEvent('THANK YOU',`${name} · ${currency}${e.amount}`)}
addEventListener('onEventReceived',o=>receive(o.detail));addEventListener('onWidgetLoad',o=>{currency=o.detail.currency?.symbol||'€';soundEnabled=true;});
if(preview){document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>scene(b.dataset.scene));document.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>receive({listener:b.dataset.alert,event:{name:document.querySelector('#viewer').value||'alex',amount:b.dataset.alert==='raid-latest'?24:5}}));document.querySelector('#send').onclick=()=>message({displayName:document.querySelector('#viewer').value||'alex',text:document.querySelector('#message').value||'this track is so good'});document.querySelector('#clear').onclick=()=>{chat.replaceChildren();queue=[];clearTimeout(timer);box.className='';busy=false};document.querySelector('#sound').onchange=e=>soundEnabled=e.target.checked;document.querySelector('#accent').oninput=e=>document.documentElement.style.setProperty('--red',e.target.value);[['jinxrl','this track is so good'],['kaelpsd','clean lines!'],['moriixx','that corner was nasty']].forEach(([displayName,text])=>message({displayName,text}));document.querySelector('#previewNote').textContent='PREVIEW / TEST EVENTS — NOT CONNECTED TO TWITCH';}

const countdown=document.querySelector('#countdown');
const seconds=window.LORAII_BRIDGE?0:Number(qs.get('countdown')||(mode==='break'?300:0));
if(countdown){if(!Number.isFinite(seconds)||seconds<=0){countdown.innerHTML='<small>YOU’RE EARLY. MAKE YOURSELF AT HOME.</small>';}
else{countdown.querySelector('small').textContent=mode==='break'?'BACK IN':'LIVE IN';const end=Date.now()+Math.min(seconds,36000)*1000;const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));countdown.querySelector('span').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');};tick();setInterval(tick,1000);}}


function applyPreferences(){const c=window.LORAII_CONFIG;stage.classList.toggle('clock-hidden',!c.clock);stage.classList.toggle('motion-off',c.motion===false);document.documentElement.style.setProperty('--red',c.accent);let st=document.querySelector('#preferences');if(!st){st=document.createElement('style');st.id='preferences';document.head.append(st)}st.textContent=`#stage #chat .msg{font-size:${c.chatSize}px}#stage .scene .art{opacity:${stage.dataset.scene==='break'?0.25:c.background/100}!important}${c.motion?'':'#stage *{animation:none!important;transition:none!important}#stage #alert.on{opacity:1;transform:none}#stage #alert.off{opacity:0}'}`;}window.applyLoraiiPreferences=applyPreferences;applyPreferences();

window.loraii={receive,message,alert:alertEvent,scene,clear:()=>{chat.replaceChildren();queue=[];clearTimeout(timer);box.className='';busy=false;document.querySelector('#featured')?.classList.remove('show');}};
})();
</script><script>
(()=>{
 const stage=document.querySelector('#stage'),q=new URLSearchParams(location.search),isPreview=!!document.querySelector('#controls');
 const hud=document.querySelector('#gameClock span');
 const updateClock=()=>{if(hud)hud.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};updateClock();setInterval(updateClock,1000);
 const featured=document.querySelector('#featured');let featureTimer;
 function feature(name,text){clearTimeout(featureTimer);featured.querySelector('strong').textContent=name;featured.querySelector('p').textContent=text;featured.classList.remove('show');void featured.offsetWidth;featured.classList.add('show');featureTimer=setTimeout(()=>featured.classList.remove('show'),15000);}
 window.loraii.feature=feature;
 if(!isPreview)return;
 const $=s=>document.querySelector(s);let remaining=300,running=false,last=0;
 function drawTimer(){const n=$('#countdown');n.replaceChildren();const small=document.createElement('small');small.textContent=remaining===0?'ANY MOMENT NOW…':running?(stage.dataset.scene==='break'?'BACK IN':'LIVE IN'):'COUNTDOWN PAUSED';const span=document.createElement('span');span.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');n.append(small,span);}
 document.querySelector('[data-scene="break"]').addEventListener('click',()=>{running=false;remaining=Math.max(1,Math.min(120,Number($('#timerMinutes').value)||5))*60;running=true;last=Date.now();drawTimer();});
 $('#startTimer').onclick=()=>{if(!running){if(remaining<=0)remaining=Math.max(1,Math.min(120,Number($('#timerMinutes').value)||5))*60;running=true;last=Date.now();drawTimer();}};
 $('#pauseTimer').onclick=()=>{running=false;drawTimer();};
 $('#resetTimer').onclick=()=>{running=false;remaining=Math.max(1,Math.min(120,Number($('#timerMinutes').value)||5))*60;drawTimer();};
 $('#timerMinutes').onchange=()=>{if(!running){remaining=Math.max(1,Math.min(120,Number($('#timerMinutes').value)||5))*60;drawTimer();}};
 setInterval(()=>{if(!running)return;const steps=Math.floor((Date.now()-last)/1000);if(steps>0){last+=steps*1000;remaining=Math.max(0,remaining-steps);if(!remaining)running=false;drawTimer();}},200);
 $('#giftTest').onclick=()=>window.loraii.receive({listener:'subscriber-latest',event:{name:$('#viewer').value||'alex',sender:$('#viewer').value||'alex',amount:5,bulkGifted:true}});

 $('#featureChat').onclick=()=>feature($('#viewer').value||'alex',$('#message').value||'thanks for hanging out tonight');
 $('#hideFeatured').onclick=()=>featured.classList.remove('show');
 $('#bgLevel').oninput=e=>{document.querySelector('#scene .art').style.opacity=Number(e.target.value)/100;};
 const names=['moriixx','kaelpsd','jinxrl','alex','sarah'];const texts=['clean lines!','one more run?','loving the late night vibes','that corner was nasty','good to see you live','let’s gooo','this track is so good'];let index=0;
 setInterval(()=>{if($('#autoChat').checked){window.loraii.message({displayName:names[index%names.length],text:texts[index%texts.length]});index++;}},3500);
 // Keep the scaled preview clear of the expanded toolbar.
 const fit=()=>{stage.style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-$('#controls').offsetHeight)/1080)})`;};
 new ResizeObserver(fit).observe($('#controls'));fit();
 const originalClear=$('#clear').onclick;$('#clear').onclick=()=>{originalClear();featured.classList.remove('show');};
})();
</script><script src="/stream-scenes.js"></script><script src="/session-stats.js"></script><script src="/control-client.js"></script><script src="/se-config.js?scene=gameplay"></script><script src="/se-connection.js"></script><script src="/motion.js"></script></body></html>
